name: Coverage

# Couverture mesurée sur la suite e2e complète (506 tests, RG09/R7/etc.) — le chiffre réel de garantie
# du projet, pas les 35 tests unitaires. Nécessite un service Postgres dédié dans ce workflow, distinct
# des workflows CI (build+lint) et Tests (unitaires), volontairement plus légers.
#
# Pas de Codecov (service tiers orienté compte/payant, écarté explicitement) : le pourcentage réel est
# lu depuis coverage/coverage-summary.json (jamais une valeur inventée), et un badge SVG est généré via
# shields.io (simple générateur d'image gratuit, sans compte) puis committé directement dans le dépôt.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  e2e-coverage:
    name: API — e2e avec couverture
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shakespeare
          POSTGRES_PASSWORD: shakespeare
          POSTGRES_DB: shakespeare_academy_test
        ports:
          # 5544, pas le 5432 par défaut : apps/api/.env.test (committé, lu par test/setup-env.ts avec
          # `override: true`) écrase toute variable DATABASE_URL déjà présente dans l'environnement —
          # trouvé en vérifiant le premier essai de ce workflow, qui échouait avec « Can't reach
          # database server at localhost:5544 » alors que le service tournait sur 5432. Aligner le port
          # du service sur .env.test plutôt que de contourner ce fichier partagé par le reste du projet.
          - 5544:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      # Nécessaire pour `prisma migrate deploy`, qui ne lit pas .env.test (seul Jest le fait, via
      # test/setup-env.ts) — même valeur que ce fichier committé, pour que les deux restent cohérents.
      DATABASE_URL: postgresql://shakespeare:shakespeare@localhost:5544/shakespeare_academy_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          # Nécessaire pour pouvoir committer le badge mis à jour en fin de job.
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # --runInBand : plusieurs suites e2e partagent la même base (voir README §Tests) — une exécution
      # parallèle provoquerait des collisions de clés uniques/FK entre suites.
      # jest-e2e.coverage.json (pas jest-e2e.json) : rootDir de ce dernier se résout au dossier test/
      # (relatif au fichier de config lui-même), donc collectCoverageFrom n'y atteint jamais src/ —
      # trouvé en vérifiant localement, jamais un « 100 % » qui n'aurait mesuré que des fakes de test.
      - run: npx jest --config ./test/jest-e2e.coverage.json --runInBand --coverage
      - run: node scripts/generate-coverage-badge.js
      - name: Committer le badge s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- ../../docs/badges/coverage.svg; then
            git add ../../docs/badges/coverage.svg
            git commit -m "Badge de couverture : mise à jour automatique [skip ci]"
            git pull --rebase origin master
            git push
          else
            echo "Badge de couverture inchangé, rien à committer."
          fi
