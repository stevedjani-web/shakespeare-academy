<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f2b78" />
    <title>Hors ligne - Shakespeare Academy</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #faf8f4; color: #1a1a2e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 380px; text-align: center; }
      .badge { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; background: #2f2b78; color: #c99a2e; font: bold 34px Georgia, serif; display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #6b6b7b; line-height: 1.5; margin: 0 0 20px; }
      a, button { display: inline-block; margin: 4px; padding: 11px 20px; border-radius: 999px; border: 1px solid #e7e3d8; background: #fff; color: #1a1a2e; font-size: 15px; text-decoration: none; cursor: pointer; }
      .primary { background: #2f2b78; border-color: #2f2b78; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">S</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Cette page n'a pas encore été copiée sur cet appareil. Revenez à l'accueil pour consulter ce qui est disponible sans Internet, ou réessayez quand la connexion sera revenue.</p>
      <a class="primary" href="/">Retour à l'accueil</a>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
